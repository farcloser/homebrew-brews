# The Homebrew the style lanes (`lint homebrew style`, `fix homebrew style`)
# run: a copy in .build/, never the user's own prefix. hack/brew reads this
# entry back with `limen pins get` and unpacks the archive (book/tooling.md,
# "Pinned artifacts beyond aqua").
pins:
  - name: homebrew
    renovate: github-releases Homebrew/brew
    version: 7.0.11
    url: https://github.com/Homebrew/brew/archive/refs/tags/${version}.tar.gz
    verify: download
    digest:
      version: 7.0.11
      sha256: 196ab65d7b5cd74c294db89c231927f2911608a8e79ac976694fd2685f5564c1
