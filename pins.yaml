# The Homebrew the style lanes (`lint homebrew style`, `fix homebrew style`)
# run: a copy in .build/, never the user's own prefix. hack/brew reads this
# entry back with `limen pins get` and unpacks the archive (book/tooling.md,
# "Pinned artifacts beyond aqua").
#
# Its method is the download itself. Homebrew signs nothing over its source:
# the release carries one asset, Homebrew.pkg, and that file is the one
# subject of the release's attestations; the tag's archive has no signature,
# checksum or attestation, and `gh release verify-asset` refuses it.
pins:
  - name: homebrew
    renovate: github-releases Homebrew/brew
    version: 7.0.16
    url: https://github.com/Homebrew/brew/archive/refs/tags/${version}.tar.gz
    verify: download
    digest:
      version: 7.0.15
      source: f8c9b1d744174e164d562632de693279098f46d847e7a96888c092640d54fb70
      sha256: 6191f34dc4d99b86043112bf304b6a012da193d302d4b62a48eafdbb738121e3
